<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quil Workspace</title>
  <link rel="stylesheet" href="src/ui/tokens.css">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--quil-bg);
      color: var(--quil-text-100);
      font-family: var(--quil-font-ui);
      font-size: var(--quil-text-base);
      overflow: hidden;
    }

    /* ---------- Top nav (Region A) ---------- */
    .topnav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: var(--quil-bg);
      border-bottom: 1px solid var(--quil-surface);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 var(--quil-space-6);
      z-index: 100;
    }

    .topnav-right {
      display: flex;
      align-items: center;
      gap: var(--quil-space-2);
    }

    .nav-btn {
      background: var(--quil-button);
      border: none;
      color: var(--quil-button-text);
      cursor: pointer;
      padding: var(--quil-space-1) var(--quil-space-3);
      border-radius: var(--quil-radius-sm);
      font-size: var(--quil-text-base);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: var(--quil-button-hover);
    }

    .nav-btn.preview {
      font-family: var(--quil-font-mono);
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .nav-btn:not(.preview) {
      font-size: 1.1em;
    }

    /* ---------- Canvas column ---------- */
    .canvas-column {
      padding-top: 90px;    /* 65px nav + 25px top spacing */
      padding-bottom: 65px; /* 65px bottom spacing */
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* Canvas wrapper — relative so quick tools can float below the card */
    .canvas-wrapper {
      position: relative;
      text-align: center;
    }

    /* Canvas card — background tracks the user's software UI bg colour via
       --quil-canvas-bg. Defaults to rgba(21, 16, 13, 0.10). */
    .canvas {
      width: calc(100vw - 620px);
      min-height: calc(100vh - 155px);
      max-width: 1200px;
      background: var(--quil-canvas-bg);
      border: var(--quil-border-width) solid var(--quil-line);
      border-radius: var(--quil-radius-xs);
      box-shadow: var(--quil-shadow-3);
      overflow-y: auto;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ---------- Quick tools (floating card below canvas) ---------- */
    .quick-tools {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 5px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: var(--quil-space-2);
      padding: var(--quil-space-2) var(--quil-space-4);
      background: var(--quil-bg);
      border: var(--quil-border-width) solid var(--quil-surface);
      border-radius: var(--quil-radius-xs);
      box-shadow: var(--quil-shadow-3);
      z-index: 2;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: #f5f0f0;
      cursor: pointer;
      padding: var(--quil-space-1) var(--quil-space-2);
      border-radius: var(--quil-radius-sm);
      font-size: var(--quil-text-base);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: var(--quil-target-icon);
      min-height: var(--quil-target-icon);
    }

    .tool-btn:hover {
      background: var(--quil-surface-hover);
    }

    .tool-btn.active {
      background: var(--quil-accent);
      color: var(--quil-accent-text);
    }

    /* ---------- Scrollbar ---------- */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--quil-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--quil-surface);
      border-radius: var(--quil-radius-sm);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--quil-line);
    }
  </style>
</head>
<body>
  <div class="topnav">
    <div class="topnav-right">
      <button class="nav-btn" title="Undo">↶</button>
      <button class="nav-btn" title="Redo">↷</button>
      <button class="nav-btn preview" title="Preview">Preview</button>
    </div>
  </div>

  <div class="canvas-column">
    <div class="canvas-wrapper">
      <div class="canvas"></div>
      <div class="quick-tools">
        <button class="tool-btn active" title="Select">▶</button>
        <button class="tool-btn" title="Frame">□</button>
        <button class="tool-btn" title="Text">T</button>
        <button class="tool-btn" title="Insert">+</button>
        <button class="tool-btn" title="Hand">✋</button>
      </div>
    </div>
  </div>
</body>
</html>
